---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sylvatwin.orange.com
  resources:
  - twinsyncs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sylvatwin.orange.com
  resources:
  - twinsyncs/finalizers
  verbs:
  - update
- apiGroups:
  - sylvatwin.orange.com
  resources:
  - twinsyncs/status
  verbs:
  - get
  - patch
  - update
